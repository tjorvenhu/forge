name: Report a bug
description: Something in FORGE does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste passwords, API keys or phone numbers.
        Do not report security vulnerabilities here. Follow SECURITY.md instead.
        You can write in English or German (Deutsch ist auch willkommen).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug. Quote error messages word for word if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. ...
        3. The error appears
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: FORGE version
      description: Shown under Settings > About FORGE.
      placeholder: e.g. 0.1.60
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: The details from Settings > About FORGE > Diagnostics (Claude Code version, sign-in status, Git, GitHub CLI).
      render: text
    validations:
      required: false
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, Windows version or anything else that could help.
    validations:
      required: false
