name: Suggestion
description: An idea for a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in English or German (Deutsch ist auch willkommen).
  - type: textarea
    id: problem
    attributes:
      label: What is it about?
      description: What do you want to do with FORGE, and what is missing for that?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your suggestion
      description: What could the solution look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: How do you work around it today, or which alternatives have you considered?
    validations:
      required: false
