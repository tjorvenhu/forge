# Types and tests on Windows, macOS and Linux. Runs for pull requests and by hand (Run workflow), not on
# every push: main is built and released nightly by release.yml, which runs lint and types on Windows itself.
# Builds no installer; the Rust tests need the frontend in apps/desktop/dist (tauri::generate_context!
# embeds it) but no bundled runtime, so the resources are switched off through TAURI_CONFIG.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Defender scans every file pnpm and cargo write; on the runner that costs minutes.
      - name: Defender off
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "Defender bleibt an: $_" }

      - uses: actions/checkout@v4

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri (WebKitGTK 4.1, tray). Screenshots go through the desktop portal over D-Bus, no extra libraries.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev pkg-config

      # Tests that commit set their own identity per repository; this covers the ones that do not.
      - name: Git identity
        run: |
          git config --global user.name "FORGE CI"
          git config --global user.email "ci@forge.local"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm -r typecheck

      - name: Sidecar tests
        if: success() || failure()
        run: pnpm --filter @forge/sidecar test

      - name: Desktop tests
        if: success() || failure()
        run: pnpm --filter @forge/desktop test

      - name: Frontend for the Rust tests
        if: success() || failure()
        run: pnpm --filter @forge/desktop exec vite build

      - name: Rust tests
        if: success() || failure()
        working-directory: apps/desktop/src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo test --lib

  # The Linux packages exactly as release.yml builds them (same system libraries, runtime and checks),
  # without publishing: so a broken AppImage or .deb shows up before the nightly release. Kept as artifact.
  bundle-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          # Same as release.yml, including the libunwind conflict of the runner image.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cache bundled runtime downloads
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: runtime-linux-x64-${{ hashFiles('scripts/prepare-runtime.mjs') }}

      - run: pnpm install --frozen-lockfile

      - name: Sidecar, frontend and runtime
        run: |
          pnpm --filter @forge/sidecar build
          pnpm --filter @forge/desktop exec vite build
          echo '{"build":{"beforeBuildCommand":""}}' > apps/desktop/src-tauri/tauri.ci.json
          node scripts/prepare-runtime.mjs --target linux-x64

      - name: Build app
        working-directory: apps/desktop
        env:
          FORGE_RUNTIME_KEY: ci
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles appimage,deb --config src-tauri/tauri.ci.json

      - name: Check packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle="apps/desktop/src-tauri/target/release/bundle"
          appimages=("$bundle"/appimage/*.AppImage)
          debs=("$bundle"/deb/*.deb)
          [ ${#appimages[@]} -eq 1 ] && [ ${#debs[@]} -eq 1 ] || { ls -la "$bundle"/* || true; echo "::error::Erwartet: genau ein AppImage und ein .deb"; exit 1; }
          for tool in node/bin/node gh/bin/gh; do
            dpkg-deb -c "${debs[0]}" | grep -E "^-rwxr-xr-x .*/runtime/$tool\$" > /dev/null || { echo "::error::runtime/$tool fehlt im .deb"; exit 1; }
          done
          check="$RUNNER_TEMP/appimage-check"
          mkdir -p "$check"
          cp "${appimages[0]}" "$check/FORGE.AppImage"
          chmod +x "$check/FORGE.AppImage"
          (cd "$check" && ./FORGE.AppImage --appimage-extract > /dev/null)
          for tool in node/bin/node gh/bin/gh; do
            find "$check/squashfs-root" -path "*/runtime/$tool" -perm -u+x | grep . > /dev/null || { echo "::error::runtime/$tool fehlt im AppImage"; exit 1; }
          done
          # The bundled node must start on the runner's glibc.
          "$(find "$check/squashfs-root" -path '*/runtime/node/bin/node' | head -1)" --version
          ls -la "${appimages[0]}" "${debs[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: forge-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
