# Builds FORGE once a night when main changed since the last release, or by hand (Run workflow), and
# publishes it as a GitHub release (version 0.1.<run number>). Nightly instead of on every push: installed
# apps offer each release as an update, and one a day is enough for people who use FORGE.
#
# Two kinds of release assets:
#   FORGE_<v>_update_<runtime>.zip   every release. Only forge-desktop.exe and the sidecar, a few MB.
#                                    Installed apps with the same bundled runtime install it in seconds.
#   FORGE_<v>_x64-setup.exe          only when the bundled runtime (node, git, gh, python) changed, or when
#                                    asked for (Run workflow → full). Needed for new installations and
#                                    for apps with an older runtime. Its runtime is the one of the update zip
#                                    of the same release.
# The runtime key comes from scripts/prepare-runtime.mjs (node-<v>_git-<v>_gh-<v>_python-<v>).
#
# FORGE_<v>.sig holds the signatures of all assets of the release (scripts/sign-update.mjs --manifest, key in
# the secret FORGE_UPDATE_SIGNING_KEY). The app installs only signed assets; the public key is in
# packages/sidecar/src/update/signature.ts. Up to 0.1.101 each asset had its own <asset>.sig and the
# installer a FORGE_<v>_x64-setup.<runtime>.runtime marker. Those versions only look at the newest release,
# so every release (nightly too) publishes both as well, until no installation up to 0.1.101 is left.
#
# Code signature (Authenticode, against SmartScreen): Azure Artifact Signing through scripts/codesign.mjs.
# Tauri signs forge-desktop.exe, the installer and the uninstaller with it; the exe of the update zip is
# signed after the build. Needs the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and the
# variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE. Without AZURE_CLIENT_ID
# the build stays unsigned with a warning.
#
# macOS and Linux (ADR 0014): after the Windows job has created the release, the jobs macos and linux build
# the same version and add their assets to it. Each one is a full build with the bundled runtime (node, gh);
# there are no small updates on these systems.
#   FORGE_<v>_darwin-arm64.app.tar.gz, FORGE_<v>_darwin-x64.app.tar.gz   FORGE.app for in-app updates
#   FORGE_<v>_darwin-arm64.dmg, FORGE_<v>_darwin-x64.dmg                 download for new installations
#   FORGE_<v>_linux-x64.AppImage, FORGE_<v>_linux-x64.deb
#   FORGE_<v>_<platform>.sig                                             signatures of that platform's assets
# The apps there take the newest release that has their platform asset, so a failed or late macOS/Linux job
# never touches the Windows release. macOS builds are signed ad hoc only (no Apple notarization).
#
# Dev channel: every push to the branch dev builds a pre-release (same version scheme; run numbers are
# shared, so dev and main versions never collide). Only apps on the dev channel take it (channelReleases
# in packages/sidecar/src/update/app-update.ts); FORGE Setup, the download counter and main apps skip
# pre-releases. Built for speed: Windows only, no lint or typecheck, no Authenticode, no per-file
# signatures. The update signature stays: the app installs nothing without it.
# Bringing dev into main: "Dev nach Main übernehmen" in the settings, or a merge on GitHub.
name: Release

on:
  schedule:
    # 03:00 UTC, early morning in Europe
    - cron: "0 3 * * *"
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "services/**"
      - "apps/installer/**"
      - ".github/workflows/setup.yml"
      - ".github/workflows/ci.yml"
      - "**.png"
      - "**.docx"
      - ".forge/**"
  workflow_dispatch:
    inputs:
      full:
        description: "Also build the full installer (with node, git, gh)"
        type: boolean
        default: false
      legacy_signatures:
        description: "Also publish the per-file .sig and the .runtime marker that FORGE up to 0.1.101 needs"
        type: boolean
        default: true

permissions:
  contents: write

# A newer run makes a running build of the same branch obsolete: only the newest one is finished.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Nightly: only when something the app is built from changed since the last release. By hand: always.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      channel: ${{ steps.check.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then echo "channel=dev" >> "$GITHUB_OUTPUT"; else echo "channel=stable" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Only version releases of main: FORGE Setup lives in the release "installer" (setup.yml), dev builds are pre-releases.
          last=$(gh api "repos/${{ github.repository }}/releases?per_page=50" --jq '[.[] | select((.tag_name | startswith("v")) and (.prerelease | not))][0].target_commitish // empty')
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # the statistics service deploys through Coolify, FORGE Setup through setup.yml, documents do not ship with the app
          changed=$(git diff --name-only "$last" HEAD | grep -Ev '\.md$|^docs/|^services/|^apps/installer/|^\.github/workflows/(setup|ci)\.yml$|\.png$|\.docx$|^\.forge/' || true)
          if [ -n "$changed" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; echo "Nothing to release since $last"; fi

  release:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ needs.changes.outputs.channel }}
    steps:
      # Defender scans every file pnpm and cargo write; on the runner that costs minutes.
      - name: Defender off
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "Defender bleibt an: $_" }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The runner ships a stable Rust; updating it on every run cost 40 s for nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Plan
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_UPDATE_SIGNING_KEY: ${{ secrets.FORGE_UPDATE_SIGNING_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CHANNEL: ${{ needs.changes.outputs.channel }}
        run: |
          # Without the key no installation would take the release: stop before the long build.
          if (-not $env:FORGE_UPDATE_SIGNING_KEY) { throw "Secret FORGE_UPDATE_SIGNING_KEY fehlt." }
          $dev = $env:CHANNEL -eq "dev"
          # Dev builds go to the people who work on FORGE: no Authenticode, it costs signatures and minutes.
          $codesign = [bool]$env:AZURE_CLIENT_ID -and -not $dev
          if (-not $codesign -and -not $dev) { Write-Host "::warning::Secret AZURE_CLIENT_ID fehlt: FORGE wird ohne Code-Signatur gebaut." }
          $version = "0.1.${{ github.run_number }}"
          $key = (node scripts/prepare-runtime.mjs --key).Trim()
          # One line per release with its asset names. Only a signed installer counts: the app ignores the
          # unsigned ones of older releases. Since 0.1.102 one FORGE_<v>.sig signs all assets of a release
          # and the runtime of its installer is the one of the update zip next to it.
          # Main counts only its own releases (a dev installer has no Authenticode, and main apps skip
          # pre-releases); dev apps also take the installers of main.
          $filter = if ($dev) { '.[]' } else { '.[] | select(.prerelease | not)' }
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" --jq ($filter + ' | [.assets[].name] | join(" ")')
          $hasInstaller = [bool]($releases | Where-Object {
            $names = $_ -split " "
            ($names | Where-Object { $_ -like "*_x64-setup.${key}.runtime.sig" -or $_ -like "*_${key}_x64-setup.exe.sig" }) -or
            (($names | Where-Object { $_ -like "*_x64-setup.exe" }) -and ($names | Where-Object { $_ -like "*_update_${key}.zip" }) -and ($names | Where-Object { $_ -match '^FORGE_[^_]+\.sig$' }))
          })
          $full = ("${{ inputs.full }}" -eq "true") -or -not $hasInstaller
          $conf = "apps/desktop/src-tauri/tauri.conf.json"
          (Get-Content $conf -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$version`"" | Set-Content $conf -NoNewline -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT
          "key=$key" >> $env:GITHUB_OUTPUT
          "full=$($full.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "codesign=$($codesign.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "dev=$($dev.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Kanal $env:CHANNEL, Version $version, Laufzeit $key, voller Installer: $full, Code-Signatur: $codesign"

      # Before the long build: a wrong account name or missing variable fails here.
      - name: Code signing tools
        if: steps.plan.outputs.codesign == 'true'
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: node scripts/codesign.mjs --setup

      - name: Cache bundled runtime downloads
        if: steps.plan.outputs.full == 'true'
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: runtime-${{ hashFiles('scripts/prepare-runtime.mjs') }}

      - run: pnpm install --frozen-lockfile

      - name: Lint and types
        if: steps.plan.outputs.dev != 'true'
        run: |
          pnpm lint
          pnpm typecheck

      - name: Sidecar and frontend
        shell: pwsh
        run: |
          pnpm --filter @forge/sidecar build
          # Types were checked above; vite alone builds the frontend the exe embeds.
          pnpm --filter @forge/desktop exec vite build
          $ci = @{ build = @{ beforeBuildCommand = "" } }
          if ("${{ steps.plan.outputs.codesign }}" -eq "true") {
            # Tauri calls it once per file: app, NSIS plugins, installer, uninstaller (the runtime is skipped).
            $ci.bundle = @{ windows = @{ signCommand = @{ cmd = "node"; args = @("$env:GITHUB_WORKSPACE\scripts\codesign.mjs", "%1") } } }
          }
          $ci | ConvertTo-Json -Depth 6 | Set-Content apps/desktop/src-tauri/tauri.ci.json -Encoding utf8

      - name: Runtime (full installer only)
        if: steps.plan.outputs.full == 'true'
        run: node scripts/prepare-runtime.mjs

      - name: Sidecar into the resources (small update only)
        if: steps.plan.outputs.full != 'true'
        shell: pwsh
        run: |
          # Tauri checks the resource folder even without bundling; the sidecar is the part that ships.
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/runtime/sidecar | Out-Null
          Copy-Item packages/sidecar/dist/sidecar.mjs apps/desktop/src-tauri/runtime/sidecar/sidecar.mjs

      - name: Build app
        shell: pwsh
        working-directory: apps/desktop
        env:
          # Built into the exe: the app checks its installed runtime against it (incomplete installations).
          FORGE_RUNTIME_KEY: ${{ steps.plan.outputs.key }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if ("${{ steps.plan.outputs.full }}" -eq "true") {
            pnpm tauri build --config src-tauri/tauri.ci.json
          } else {
            pnpm tauri build --no-bundle --config src-tauri/tauri.ci.json
          }
          if ($LASTEXITCODE -ne 0) { throw "Build fehlgeschlagen." }
          # The exe for the update zip: --no-bundle signs nothing, and after bundling Tauri restores the
          # unsigned binary in target/release.
          if ("${{ steps.plan.outputs.codesign }}" -eq "true") {
            node ../../scripts/codesign.mjs src-tauri/target/release/forge-desktop.exe
            if ($LASTEXITCODE -ne 0) { throw "Code-Signatur fehlgeschlagen." }
          }

      - name: Package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_UPDATE_SIGNING_KEY: ${{ secrets.FORGE_UPDATE_SIGNING_KEY }}
        run: |
          $version = "${{ steps.plan.outputs.version }}"
          $key = "${{ steps.plan.outputs.key }}"
          $tag = "v$version"
          $pkg = Join-Path $env:RUNNER_TEMP "pkg"
          New-Item -ItemType Directory -Force "$pkg/runtime/sidecar" | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/forge-desktop.exe "$pkg/forge-desktop.exe"
          Copy-Item packages/sidecar/dist/sidecar.mjs "$pkg/runtime/sidecar/sidecar.mjs"
          @{ version = $version; runtime = $key } | ConvertTo-Json | Set-Content "$pkg/update.json" -Encoding utf8
          $zip = Join-Path $env:RUNNER_TEMP "FORGE_${version}_update_${key}.zip"
          # Windows tar writes zip entries with forward slashes, as the app's tar.exe expects.
          tar.exe -a -c -f $zip -C $pkg forge-desktop.exe runtime update.json
          $files = @($zip)
          if ("${{ steps.plan.outputs.full }}" -eq "true") {
            $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
            $named = Join-Path $env:RUNNER_TEMP "FORGE_${version}_x64-setup.exe"
            Copy-Item $setup.FullName $named
            $files += $named
          }
          if ("${{ steps.plan.outputs.codesign }}" -eq "true") {
            $exes = @("$pkg/forge-desktop.exe") + @($files | Where-Object { $_ -like "*.exe" })
            foreach ($exe in $exes) {
              $s = Get-AuthenticodeSignature $exe
              if ($s.Status -ne "Valid") { throw "Code-Signatur fehlt oder ist ungültig: $exe ($($s.Status))" }
              Write-Host ("codesigniert: {0}  {1}" -f (Split-Path $exe -Leaf), $s.SignerCertificate.Subject)
            }
          }
          # After the code signature: it changes the files, the update signature covers the final bytes.
          # One signature file for all assets of the release.
          $sigs = Join-Path $env:RUNNER_TEMP "FORGE_${version}.sig"
          node scripts/sign-update.mjs --manifest $sigs @files
          if ($LASTEXITCODE -ne 0) { throw "Signieren fehlgeschlagen." }
          if ("${{ inputs.legacy_signatures }}" -ne "false" -and "${{ steps.plan.outputs.dev }}" -ne "true") {
            # Installations up to 0.1.101 only know <asset>.sig and the .runtime marker, and they only look
            # at the newest release: one bridge release cannot reach them, every release has to carry both.
            $legacy = @($files)
            if ("${{ steps.plan.outputs.full }}" -eq "true") {
              $marker = Join-Path $env:RUNNER_TEMP "FORGE_${version}_x64-setup.${key}.runtime"
              Set-Content $marker $key -NoNewline -Encoding ascii
              $legacy += $marker
            }
            node scripts/sign-update.mjs @legacy
            if ($LASTEXITCODE -ne 0) { throw "Signieren fehlgeschlagen." }
            $files = @($legacy) + @($legacy | ForEach-Object { "$_.sig" })
          }
          $files += $sigs
          $dev = "${{ steps.plan.outputs.dev }}" -eq "true"
          # Notes since the previous release of the same channel. git describe would find dev tags on main
          # once dev was merged, and main would only list what came after the last dev build.
          $filter = if ($dev) { 'select(.prerelease and (.tag_name | startswith("v")))' } else { 'select((.prerelease | not) and (.tag_name | startswith("v")))' }
          $prev = gh api "repos/${{ github.repository }}/releases?per_page=50" --jq ('[.[] | ' + $filter + '][0].tag_name // empty')
          if ($prev) { git rev-parse -q --verify "refs/tags/$prev" *> $null; if ($LASTEXITCODE -ne 0) { $prev = $null } }
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD~20..HEAD" }
          $notes = (git log $range --no-merges --format="- %s") -join "`n"
          if (-not $notes) { $notes = "- Maintenance" }
          if ($dev) {
            # Pre-release: main apps, FORGE Setup and the download counter skip it; "Latest" stays on main.
            gh release create $tag @files --title "FORGE $version (dev)" --notes $notes --target $env:GITHUB_SHA --prerelease --latest=false
          } else {
            # "Latest" stays on the newest full installer: the download for new installations, and what
            # versions before the small updates look for (they only read releases/latest).
            $latest = if ("${{ steps.plan.outputs.full }}" -eq "true") { "--latest" } else { "--latest=false" }
            gh release create $tag @files --title "FORGE $version" --notes $notes --target $env:GITHUB_SHA $latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Release anlegen fehlgeschlagen." }
          Get-Item $files | ForEach-Object { Write-Host ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)) }

      # Dev builds pile up: keep the newest three and the newest one with a full installer.
      - name: Clean up old dev releases
        if: steps.plan.outputs.dev == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $jq = '[.[] | select(.prerelease and (.tag_name | startswith("v")))] | sort_by(.created_at) | reverse | .[] | .tag_name + " " + ([.assets[].name | select(endswith("_x64-setup.exe"))] | length | tostring)'
          $list = @(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq $jq)
          $installerKept = $false
          for ($i = 0; $i -lt $list.Count; $i++) {
            $tag, $installers = $list[$i] -split " "
            $hasInstaller = [int]$installers -gt 0
            if ($i -lt 3 -or ($hasInstaller -and -not $installerKept)) {
              if ($hasInstaller) { $installerKept = $true }
              continue
            }
            Write-Host "Lösche altes Dev-Release $tag"
            gh release delete $tag --repo "${{ github.repository }}" --yes --cleanup-tag
          }

  # Separate jobs after the Windows release: whatever happens here, the Windows release stays as it is.
  macos:
    needs: release
    # Dev builds are Windows only, for speed.
    if: needs.release.outputs.channel != 'dev'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: darwin-arm64
          # Built on the arm64 runner too: Rust cross-compiles, prepare-runtime.mjs loads the x64 node and gh.
          - target: x86_64-apple-darwin
            platform: darwin-x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Cache bundled runtime downloads
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: runtime-${{ matrix.platform }}-${{ hashFiles('scripts/prepare-runtime.mjs') }}

      - run: pnpm install --frozen-lockfile

      - name: Plan
        id: plan
        run: |
          version="${{ needs.release.outputs.version }}"
          if [ -z "$version" ]; then echo "::error::Keine Version aus dem Windows-Job."; exit 1; fi
          key=$(node scripts/prepare-runtime.mjs --key --target ${{ matrix.platform }})
          # Same patch as the Windows job: the version lives in tauri.conf.json only.
          node -e 'const fs=require("fs");const f="apps/desktop/src-tauri/tauri.conf.json";fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace(/"version":\s*"[^"]*"/g,"\"version\": \""+process.argv[1]+"\""))' "$version"
          grep -q "\"version\": \"$version\"" apps/desktop/src-tauri/tauri.conf.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Version $version, Laufzeit $key"

      - name: Sidecar, frontend and runtime
        run: |
          pnpm --filter @forge/sidecar build
          pnpm --filter @forge/desktop exec vite build
          echo '{"build":{"beforeBuildCommand":""}}' > apps/desktop/src-tauri/tauri.ci.json
          node scripts/prepare-runtime.mjs --target ${{ matrix.platform }}

      - name: Build app
        working-directory: apps/desktop
        env:
          FORGE_RUNTIME_KEY: ${{ steps.plan.outputs.key }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.ci.json

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_UPDATE_SIGNING_KEY: ${{ secrets.FORGE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${{ steps.plan.outputs.version }}"
          base="FORGE_${version}_${{ matrix.platform }}"
          bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          app="$bundle/macos/FORGE.app"
          dmgs=("$bundle"/dmg/*.dmg)
          if [ ! -d "$app" ] || [ ${#dmgs[@]} -ne 1 ]; then
            ls -la "$bundle" "$bundle/macos" "$bundle/dmg" || true
            echo "::error::Erwartet: FORGE.app und genau eine .dmg"; exit 1
          fi
          # A broken seal makes macOS call the app damaged; the runtime must keep its executable bits.
          codesign --verify --deep --verbose=2 "$app"
          for tool in node/bin/node gh/bin/gh; do
            test -x "$app/Contents/Resources/runtime/$tool" || { echo "::error::runtime/$tool fehlt oder ist nicht ausführbar"; exit 1; }
          done
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          # Top-level folder FORGE.app; COPYFILE_DISABLE keeps AppleDouble files (._*) out of the archive.
          COPYFILE_DISABLE=1 tar -czf "$out/$base.app.tar.gz" -C "$bundle/macos" FORGE.app
          cp "${dmgs[0]}" "$out/$base.dmg"
          node scripts/sign-update.mjs --manifest "$out/$base.sig" "$out/$base.app.tar.gz" "$out/$base.dmg"
          # The signatures last: the app only offers assets that are signed.
          gh release upload "v$version" "$out/$base.app.tar.gz" "$out/$base.dmg" --clobber --repo "${{ github.repository }}"
          gh release upload "v$version" "$out/$base.sig" --clobber --repo "${{ github.repository }}"
          ls -la "$out"

  linux:
    needs: release
    if: needs.release.outputs.channel != 'dev'
    # The oldest supported runner: an AppImage runs on systems with this glibc or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          # The runner image ships libunwind-14-dev, which conflicts with libunwind-dev that libgstreamer1.0-dev
          # needs ("held broken packages").
          sudo apt-get remove -y libunwind-14-dev || true
          # Tauri (WebKitGTK 4.1, tray, AppImage), then GStreamer, which the AppImage bundles for audio and
          # video in the webview (bundleMediaFramework). Screenshots go through the desktop portal over D-Bus.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libxdo-dev pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cache bundled runtime downloads
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: runtime-linux-x64-${{ hashFiles('scripts/prepare-runtime.mjs') }}

      - run: pnpm install --frozen-lockfile

      - name: Plan
        id: plan
        run: |
          version="${{ needs.release.outputs.version }}"
          if [ -z "$version" ]; then echo "::error::Keine Version aus dem Windows-Job."; exit 1; fi
          key=$(node scripts/prepare-runtime.mjs --key --target linux-x64)
          # Same patch as the Windows job: the version lives in tauri.conf.json only.
          node -e 'const fs=require("fs");const f="apps/desktop/src-tauri/tauri.conf.json";fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace(/"version":\s*"[^"]*"/g,"\"version\": \""+process.argv[1]+"\""))' "$version"
          grep -q "\"version\": \"$version\"" apps/desktop/src-tauri/tauri.conf.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Version $version, Laufzeit $key"

      - name: Sidecar, frontend and runtime
        run: |
          pnpm --filter @forge/sidecar build
          pnpm --filter @forge/desktop exec vite build
          echo '{"build":{"beforeBuildCommand":""}}' > apps/desktop/src-tauri/tauri.ci.json
          node scripts/prepare-runtime.mjs --target linux-x64

      - name: Build app
        working-directory: apps/desktop
        env:
          FORGE_RUNTIME_KEY: ${{ steps.plan.outputs.key }}
          # linuxdeploy is itself an AppImage; this way it runs without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles appimage,deb --config src-tauri/tauri.ci.json

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_UPDATE_SIGNING_KEY: ${{ secrets.FORGE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${{ steps.plan.outputs.version }}"
          base="FORGE_${version}_linux-x64"
          bundle="apps/desktop/src-tauri/target/release/bundle"
          appimages=("$bundle"/appimage/*.AppImage)
          debs=("$bundle"/deb/*.deb)
          if [ ${#appimages[@]} -ne 1 ] || [ ${#debs[@]} -ne 1 ]; then
            ls -la "$bundle" "$bundle/appimage" "$bundle/deb" || true
            echo "::error::Erwartet: genau ein AppImage und ein .deb"; exit 1
          fi
          # The bundled runtime must arrive with its executable bits in both formats.
          for tool in node/bin/node gh/bin/gh; do
            dpkg-deb -c "${debs[0]}" | grep -E "^-rwxr-xr-x .*/runtime/$tool\$" > /dev/null || { echo "::error::runtime/$tool fehlt im .deb oder ist nicht ausführbar"; exit 1; }
          done
          check="$RUNNER_TEMP/appimage-check"
          mkdir -p "$check"
          cp "${appimages[0]}" "$check/FORGE.AppImage"
          chmod +x "$check/FORGE.AppImage"
          (cd "$check" && ./FORGE.AppImage --appimage-extract > /dev/null)
          for tool in node/bin/node gh/bin/gh; do
            find "$check/squashfs-root" -path "*/runtime/$tool" -perm -u+x | grep . > /dev/null || { echo "::error::runtime/$tool fehlt im AppImage oder ist nicht ausführbar"; exit 1; }
          done
          rm -rf "$check"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp "${appimages[0]}" "$out/$base.AppImage"
          cp "${debs[0]}" "$out/$base.deb"
          node scripts/sign-update.mjs --manifest "$out/$base.sig" "$out/$base.AppImage" "$out/$base.deb"
          # The signatures last: the app only offers assets that are signed.
          gh release upload "v$version" "$out/$base.AppImage" "$out/$base.deb" --clobber --repo "${{ github.repository }}"
          gh release upload "v$version" "$out/$base.sig" --clobber --repo "${{ github.repository }}"
          ls -la "$out"
