# Builds FORGE Setup (apps/installer), the small online installer that stays the same across FORGE
# versions: it looks up the newest release on GitHub, downloads the signed full installer (and a newer
# small update) and checks both against the release signature before it installs them.
#
# Published as FORGE-Setup.exe in the prerelease "installer", so its address never changes:
#   https://github.com/vanturis/forge/releases/download/installer/FORGE-Setup.exe
# A prerelease is never "latest" and the app ignores it when it looks for updates. Runs when the setup
# changes on main, or by hand.
name: Setup

on:
  push:
    branches: [main]
    paths:
      - "apps/installer/**"
      - ".github/workflows/setup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: setup
  cancel-in-progress: true

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Defender off
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "Defender bleibt an: $_" }

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/installer

      - name: Code signing tools
        id: codesign
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if (-not $env:AZURE_CLIENT_ID) {
            Write-Host "::warning::Secret AZURE_CLIENT_ID fehlt: FORGE Setup wird ohne Code-Signatur gebaut."
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          node scripts/codesign.mjs --setup
          if ($LASTEXITCODE -ne 0) { throw "Code-Signatur nicht bereit." }
          "enabled=true" >> $env:GITHUB_OUTPUT

      - name: Test
        working-directory: apps/installer
        run: cargo test --release

      - name: Build
        working-directory: apps/installer
        run: cargo build --release

      - name: Sign and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP "FORGE-Setup.exe"
          Copy-Item apps/installer/target/release/forge-setup.exe $out
          if ("${{ steps.codesign.outputs.enabled }}" -eq "true") {
            node scripts/codesign.mjs $out
            if ($LASTEXITCODE -ne 0) { throw "Code-Signatur fehlgeschlagen." }
            $s = Get-AuthenticodeSignature $out
            if ($s.Status -ne "Valid") { throw "Code-Signatur fehlt oder ist ungültig: $($s.Status)" }
            Write-Host ("codesigniert: {0}" -f $s.SignerCertificate.Subject)
          }
          $notes = "FORGE Setup lädt die neueste FORGE-Version von GitHub und installiert sie. Stand: ${{ github.sha }}`n`nFORGE Setup downloads the newest FORGE version from GitHub and installs it."
          gh release view installer -R ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create installer $out -R ${{ github.repository }} --prerelease --target $env:GITHUB_SHA --title "FORGE Setup" --notes $notes
          } else {
            gh release upload installer $out -R ${{ github.repository }} --clobber
            gh release edit installer -R ${{ github.repository }} --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Veröffentlichen fehlgeschlagen." }
          Write-Host ("FORGE-Setup.exe  {0:N1} MB" -f ((Get-Item $out).Length / 1MB))
