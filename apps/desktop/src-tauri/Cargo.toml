[package]
name = "forge-desktop"
version = "0.1.0"
description = "FORGE – AI Development Studio"
authors = ["Vanturis UG (haftungsbeschränkt)"]
homepage = "https://vanturis.de"
repository = "https://github.com/vanturis/forge"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "forge_desktop_lib"
# Desktop only: staticlib and cdylib are for Tauri mobile and each cost a full extra link.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
# Screenshots outside Windows: the image clipboard and the key.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
tauri-plugin-global-shortcut = "2.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow", "NSResponder", "NSApplication", "NSRunningApplication"] }
objc2-foundation = "0.3"
# Screen capture with CoreGraphics.
xcap = { version = "0.9", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Screen capture through the desktop portal (X11 and Wayland); xcap needs newer PipeWire headers than
# Ubuntu 22.04 has, which the AppImage is built on for older glibc.
zbus = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
# No LTO: with cached dependencies the release build takes 40 s instead of 1.5 min (thin LTO),
# the exe grows by about 9 %. The shell only manages windows and processes, speed does not matter.
lto = false
opt-level = "s"
strip = true
