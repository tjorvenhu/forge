[package]
name = "forge-desktop"
version = "0.1.0"
description = "FORGE – Claude Development Studio"
edition = "2021"
publish = false

[lib]
name = "forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
