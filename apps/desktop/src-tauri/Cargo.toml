[package]
name = "forge-desktop"
version = "0.1.0"
description = "FORGE – Claude Development Studio"
edition = "2021"
publish = false

[lib]
name = "forge_desktop_lib"
# Desktop only: staticlib and cdylib are for Tauri mobile and each cost a full extra link.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# No LTO: with cached dependencies the release build takes 40 s instead of 1.5 min (thin LTO),
# the exe grows by about 9 %. The shell only manages windows and processes, speed does not matter.
lto = false
opt-level = "s"
strip = true
