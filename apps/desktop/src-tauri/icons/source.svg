  <path d="M188 548 L860 548 L792 584 L205 588 Z" fill="#7a80a4" opacity="0.8"/>
  <!-- feet -->
  <path d="M300 955 L410 955 L430 1020 L296 1020 Z" fill="#565c80"/>
  <path d="M780 955 L890 950 L893 1020 L748 1020 Z" fill="#40456a"/>
