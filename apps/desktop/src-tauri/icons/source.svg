  <!-- body -->
  <path d="M152 548 Q152 532 168 528 L880 528 L903 548 L1165 548 Q1105 640 880 716 Q790 745 765 810 Q768 880 890 950 L893 1020 L718 1020 Q690 940 600 940 Q510 940 474 1020 L296 1020 L300 955 Q430 885 445 815 Q430 700 330 645 Q250 622 185 616 Q152 610 152 588 Z" fill="url(#body)"/>
  <!-- horn -->
  <path d="M885 548 L1165 548 Q1105 640 880 716 Q860 640 885 548 Z" fill="url(#horn)"/>
  <!-- light facet on the waist -->
  <path d="M370 650 Q470 660 520 690 L830 948 L700 856 L480 856 Q460 780 440 740 Z" fill="url(#facet)"/>
  <path d="M520 690 L830 948 L812 952 L505 702 Z" fill="#5a5cf2" opacity="0.9"/>
