<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#16171c"/>
  <rect x="8" y="8" width="1008" height="1008" rx="216" fill="none" stroke="#6e6bf7" stroke-opacity="0.35" stroke-width="16"/>
  <g transform="translate(112 112) scale(0.74) translate(-120 -110)">
  <defs>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f7cff"/>
      <stop offset="1" stop-color="#4a4ff0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5cf2"/>
      <stop offset="0.5" stop-color="#5149e8"/>
      <stop offset="1" stop-color="#6f86ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6080"/>
      <stop offset="0.55" stop-color="#3c4160"/>
      <stop offset="1" stop-color="#2a2d44"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a82a8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a3abd0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#40466a"/>
      <stop offset="1" stop-color="#6a75b0"/>
    </linearGradient>
  </defs>

  <!-- sparks -->
  <path d="M627 213 C636 300 650 345 716 362 C650 378 636 420 627 497 C618 420 604 378 540 362 C604 345 618 300 627 213 Z" fill="url(#spark)"/>
  <path d="M420 355 L502 402 L553 498 Z" fill="url(#spark)"/>
