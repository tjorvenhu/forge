<!doctype html>
<!-- Source of sidebar.bmp (164x314, welcome and finish page of the NSIS installer). Rendered with
     Chrome headless at device scale 1 and converted to 24-bit BMP by render.ps1. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 164px; height: 314px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(150px 170px at 112% 72%, rgba(249, 115, 22, 0.30), rgba(249, 115, 22, 0) 70%),
      radial-gradient(120px 120px at -20% 108%, rgba(30, 41, 59, 0.9), rgba(30, 41, 59, 0) 70%),
      linear-gradient(180deg, #181c24 0%, #12151b 100%);
  }
  .wordmark { position: absolute; left: 18px; top: 26px; width: 115px; }
  .glow {
    position: absolute; left: 22px; top: 150px; width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(249, 115, 22, 0.35), rgba(249, 115, 22, 0) 65%);
  }
  .tile { position: absolute; left: 32px; top: 160px; width: 100px; height: 100px; transform: rotate(-6deg); }
  .line { position: absolute; left: 18px; top: 66px; width: 28px; height: 2px; border-radius: 1px; background: #f97316; }
</style>
</head>
<body>
  <img class="wordmark" src="../../src/assets/forge-logo.png" alt="">
  <div class="line"></div>
  <div class="glow"></div>
  <img class="tile" src="../../src/assets/logo.svg" alt="">
</body>
</html>
