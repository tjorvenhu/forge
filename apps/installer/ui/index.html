<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORGE Setup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Layout of the setup assistant in the app (apps/desktop/src/components/setup/SetupWizard.tsx). -->
<div class="app" id="app" data-screen="loading">
  <aside class="rail">
    <div class="rail-top" data-tauri-drag-region>
      <img class="logo" src="assets/forge-logo.png" height="26" width="123" alt="FORGE, Claude Development Studio" draggable="false" data-tauri-drag-region>
    </div>
    <ol class="steps" id="steps" aria-label="">
      <li data-index="0"></li>
      <li data-index="1"></li>
      <li data-index="2"></li>
      <li data-index="3"></li>
      <li data-index="4"></li>
    </ol>
    <div class="rail-foot">
      <button type="button" class="link" id="btn-license"><span data-i18n="licenseLink"></span></button>
      <p><span data-i18n="productBy"></span> <button type="button" class="link link-strong" id="btn-vanturis">Vanturis</button></p>
    </div>
  </aside>

  <section class="main">
    <header class="titlebar" data-tauri-drag-region>
      <div class="segment" role="radiogroup" id="lang">
        <button type="button" role="radio" data-lang="de">DE</button>
        <button type="button" role="radio" data-lang="en">EN</button>
      </div>
      <button type="button" class="win-btn" id="btn-min" data-i18n-label="minimize">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button type="button" class="win-btn win-close" id="btn-close" data-i18n-label="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>

    <div class="head" id="head">
      <span class="tile" id="tile"><svg viewBox="0 0 24 24" aria-hidden="true" id="tile-icon"></svg></span>
      <div class="head-text">
        <p class="caption" id="head-caption"></p>
        <h1 id="head-title"></h1>
        <p class="lead" id="head-lead"></p>
      </div>
      <div class="head-skeleton" aria-hidden="true">
        <span class="sk" style="width: 72px; height: 10px"></span>
        <span class="sk" style="width: 210px; height: 16px"></span>
        <span class="sk" style="width: 300px; height: 12px"></span>
      </div>
    </div>

    <div class="body">
      <div class="stage card" id="stage" aria-hidden="true">
        <svg class="art" id="art" viewBox="-50 -170 1140 920" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- colors and shapes of the anvil from apps/desktop/src/assets/logo.svg -->
            <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#E5E7EB"/>
              <stop offset="1" stop-color="#94A3B8"/>
            </linearGradient>
            <linearGradient id="spark" x1="1" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FDBA74"/>
              <stop offset="0.45" stop-color="#F97316"/>
              <stop offset="1" stop-color="#EA580C"/>
            </linearGradient>
            <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#C3CCD8"/>
              <stop offset="1" stop-color="#64748B"/>
            </linearGradient>
            <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="560" cy="470" r="230">
              <stop offset="0" stop-color="#F97316" stop-opacity="0.5"/>
              <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="head-metal" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#E5E7EB"/>
              <stop offset="0.55" stop-color="#C3CCD8"/>
              <stop offset="1" stop-color="#94A3B8"/>
            </linearGradient>
            <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#94A3B8"/>
              <stop offset="1" stop-color="#64748B"/>
            </linearGradient>
            <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#475569"/>
              <stop offset="1" stop-color="#1E293B"/>
            </linearGradient>
            <radialGradient id="heat-grad" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#FFF7ED" stop-opacity="0.9"/>
              <stop offset="0.3" stop-color="#FDBA74" stop-opacity="0.6"/>
              <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
              <stop offset="1" stop-color="#000" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <ellipse cx="512" cy="716" rx="300" ry="26" fill="url(#shadow)"/>

          <g>
            <g stroke-linejoin="round" stroke-width="12">
              <path d="M160 367 H549 L450 462 H240 Z" fill="url(#horn)" stroke="url(#horn)"/>
              <path id="anvil-face" d="M618 321 H864 L720 462 H474 Z" fill="url(#spark)" stroke="url(#spark)"/>
            </g>
            <path d="M350 489 H674 Q688 489 688 503 V522 C640 528 614 556 614 590 C614 628 650 652 728 656 Q742 657 742 671 V689 Q742 703 728 703 H584 C580 670 552 656 512 656 C472 656 444 670 440 703 H296 Q282 703 282 689 V671 Q282 657 296 656 C374 652 410 628 410 590 C410 556 384 528 336 522 V503 Q336 489 350 489 Z" fill="url(#body)"/>
            <path id="anvil-glow" d="M350 489 H674 Q688 489 688 503 V522 C640 528 614 556 614 590 C614 628 650 652 728 656 Q742 657 742 671 V689 Q742 703 728 703 H584 C580 670 552 656 512 656 C472 656 444 670 440 703 H296 Q282 703 282 689 V671 Q282 657 296 656 C374 652 410 628 410 590 C410 556 384 528 336 522 V503 Q336 489 350 489 Z" fill="url(#glow)" opacity="0.3"/>
            <ellipse id="heat" cx="735" cy="326" rx="120" ry="52" fill="url(#heat-grad)" opacity="0"/>
          </g>

          <!-- pivot of the swing: the grip end of the handle -->
          <g id="hammer">
            <rect x="772" y="226" width="300" height="40" rx="18" fill="url(#handle)"/>
            <rect x="1028" y="221" width="52" height="50" rx="20" fill="#0F172A"/>
            <rect x="786" y="222" width="22" height="48" rx="6" fill="url(#spark)"/>
            <rect x="676" y="168" width="118" height="134" rx="16" fill="url(#head-metal)"/>
            <rect x="676" y="168" width="118" height="22" rx="10" fill="#F1F5F9" opacity="0.5"/>
            <rect x="666" y="292" width="138" height="30" rx="9" fill="url(#face)"/>
            <rect x="700" y="196" width="10" height="92" rx="5" fill="#FFFFFF" opacity="0.3"/>
          </g>

          <circle id="impact" cx="735" cy="321" r="1" fill="none"/>
        </svg>
        <canvas id="sparks" class="sparks"></canvas>
      </div>

      <!-- start -->
      <div class="pane" data-for="start loading">
        <label class="field-label" data-i18n="folder" for="folder-path"></label>
        <div class="field-row">
          <div class="input" id="folder-path" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            <span id="folder-text"></span>
            <span class="sk sk-inline" style="width: 220px; height: 10px"></span>
          </div>
          <button type="button" class="btn btn-secondary" id="btn-change" data-i18n="change"></button>
        </div>
        <div class="note" id="note" data-state="resolving">
          <span class="note-resolving"><span class="sk" style="width: 150px; height: 10px"></span></span>
          <span class="note-ready" id="note-ready"></span>
          <span class="note-other" id="note-other"></span>
          <div class="note-error alert">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            <span id="resolve-error"></span>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-resolve-retry" data-i18n="retry"></button>
          </div>
        </div>
      </div>

      <!-- installing -->
      <div class="pane" data-for="installing">
        <div class="progress-row">
          <span id="progress-detail"></span>
          <span class="percent" id="percent">0 %</span>
        </div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <!-- done -->
      <div class="pane" data-for="done">
        <div class="result">
          <svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <div>
            <p class="field-label" data-i18n="installedIn"></p>
            <p class="path" id="done-path"></p>
          </div>
        </div>
      </div>

      <!-- error -->
      <div class="pane" data-for="error">
        <div class="alert alert-block">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          <span id="error-message"></span>
        </div>
      </div>
    </div>

    <footer class="foot">
      <button type="button" class="btn btn-ghost" id="btn-cancel" data-i18n="close"></button>
      <button type="button" class="btn btn-primary" id="btn-primary">
        <svg class="spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <span id="btn-primary-text"></span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </footer>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
