# Statistics service and its Postgres as one Coolify resource (Build Pack: Docker Compose).
# SERVICE_USER_POSTGRES and SERVICE_PASSWORD_POSTGRES are generated by Coolify on the first deploy
# and stay the same afterwards. The database is only reachable inside this compose network.
services:
  stats:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/forge_stats
      # header in which a proxy in front of Coolify passes the client address (README)
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: forge_stats
    volumes:
      - stats-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d forge_stats"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  stats-db:
